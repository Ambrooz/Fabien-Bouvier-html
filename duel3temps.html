<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Chronoduel - Présent / PC / Futur proche ⚡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #2a1b3d 0%, #1a0f2a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(20, 10, 35, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px;
            border: 2px solid #a370f0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px #a370f070;
            padding: 32px 24px;
            color: white;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #f0e68c, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px #00000070;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a1e3c;
            border-radius: 60px;
            padding: 12px 28px;
            margin: 15px 0 25px 0;
            border: 1px solid #b180ff;
            flex-wrap: wrap;
            gap: 15px;
            color: #d8c4ff;
            font-weight: 500;
        }

        .badge {
            background: #4a2f6e;
            color: #ffde9e;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 700;
            border: 1px solid #c59aff;
        }

        .players-setup {
            background: #1e1333;
            border-radius: 48px;
            padding: 30px 20px;
            border: 2px solid #9f7aea;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .player-card {
            flex: 1 1 260px;
            background: #120b1f;
            border-radius: 40px;
            padding: 25px 15px;
            text-align: center;
            border: 3px solid;
            transition: 0.2s;
        }

        .player-card.blue {
            border-color: #4299e1;
            box-shadow: 0 8px 0 #2b4f8c;
        }
        .player-card.red {
            border-color: #f56565;
            box-shadow: 0 8px 0 #972424;
        }

        .player-card input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 60px;
            border: none;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            margin: 15px 0;
            background: #f0e9ff;
            border: 3px solid transparent;
        }
        .player-card.blue input:focus { border-color: #4299e1; outline: none; }
        .player-card.red input:focus { border-color: #f56565; outline: none; }

        .btn-join {
            background: #b794f4;
            border: none;
            color: #140b22;
            font-weight: bold;
            font-size: 1.3rem;
            padding: 16px 20px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 0 #6b46a1;
            width: 100%;
        }
        .btn-join:hover { transform: translateY(-2px); background: #c3a0ff; }

        .game-area {
            display: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .game-area.visible {
            display: block;
            opacity: 1;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0e071b;
            border-radius: 120px;
            padding: 12px 25px;
            margin: 20px 0 25px 0;
            border: 2px solid #b87cf7;
            font-size: 1.7rem;
            font-weight: 700;
        }

        .score {
            background: #f0e6ff;
            color: #1e0f33;
            padding: 8px 28px;
            border-radius: 60px;
            font-size: 2rem;
            min-width: 90px;
            text-align: center;
        }

        .question-panel {
            background: #22173a;
            border-radius: 60px;
            padding: 30px 20px 40px 20px;
            text-align: center;
            border: 3px solid #c59aff;
            box-shadow: inset 0 0 15px #00000060;
        }

        .verbe-a-deviner {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.2;
            text-shadow: 0 6px 0 #0d0829;
            margin: 5px 0 20px 0;
            word-break: break-word;
            color: #ffe69b;
        }

        .consigne-temps {
            font-size: 2rem;
            background: #31274a;
            display: inline-block;
            padding: 10px 40px;
            border-radius: 60px;
            color: #fbbf24;
            border: 2px solid #fbbf24;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .boutons-reponse {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin: 30px 0 25px;
        }

        .btn-reponse {
            flex: 1 1 160px;
            padding: 22px 10px;
            font-size: 2rem;
            font-weight: 700;
            border: none;
            border-radius: 70px;
            background: white;
            color: #0f0722;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 10px 0 #4c3b6b, 0 4px 15px black;
            border: 2px solid #c0a0ff;
        }
        .btn-reponse.present { background: #b9f5d8; }
        .btn-reponse.passe { background: #fbc2c2; }
        .btn-reponse.futur { background: #ffeaa5; }
        .btn-reponse:active { transform: translateY(6px); box-shadow: 0 4px 0 #352b4a; }
        .btn-reponse:disabled { opacity: 0.4; transform: none; pointer-events: none; }

        .timer-bar {
            background: #0b0716;
            height: 26px;
            border-radius: 100px;
            margin: 25px 0 15px 0;
            border: 2px solid #9b6de0;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #a78bfa, #ec4899);
            transition: width 1s linear;
        }

        .feedback-message {
            min-height: 60px;
            font-size: 1.7rem;
            font-weight: 500;
            color: #ffe07a;
            padding: 10px;
        }

        .footer-stats {
            display: flex;
            justify-content: space-between;
            color: #c2a9ff;
            margin-top: 20px;
            font-size: 1.3rem;
        }

        .restart-btn {
            background: none;
            border: 3px solid #b77ef0;
            color: #f0d69e;
            padding: 12px 35px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 25px;
        }
        .restart-btn:hover { background: #5a3d8c; color: white; border-color: #eab308; }

        .hidden { display: none; }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .verbe-a-deviner { font-size: 3rem; }
            .btn-reponse { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>
        <span>⚡</span> CHRONODUEL <span>⏳</span>
    </h1>
    <div class="sub-header">
        <span class="badge">Présent</span>
        <span class="badge">Passé composé</span>
        <span class="badge">Futur proche</span>
        <span class="badge">⚔️ Duel</span>
    </div>

    <!-- Écran de sélection des joueurs -->
    <div id="setupScreen">
        <div class="players-setup">
            <div class="player-card blue">
                <div style="font-size: 3rem;">🔵</div>
                <h2 style="color:#90cdf4;">Dueliste 1</h2>
                <input type="text" id="player1Name" placeholder="Nom du joueur 1" value="Axel">
                <button class="btn-join" id="joinPlayer1Btn">👉 Je suis Joueur 1</button>
            </div>
            <div class="player-card red">
                <div style="font-size: 3rem;">🔴</div>
                <h2 style="color:#feb2b2;">Dueliste 2</h2>
                <input type="text" id="player2Name" placeholder="Nom du joueur 2" value="Jade">
                <button class="btn-join" id="joinPlayer2Btn">👈 Je suis Joueur 2</button>
            </div>
        </div>
        <div style="text-align:center; font-size:1.6rem; margin: 15px 0; color:#d6bbfc;">👉 Choisis ton camp pour commencer !</div>
    </div>

    <!-- Écran de jeu principal -->
    <div id="gameScreen" class="game-area">
        <div class="scoreboard">
            <span id="player1Display">🔵 Joueur 1</span>
            <span class="score" id="scorePlayer1">0</span>
            <span style="font-size:2rem;">🗡️</span>
            <span class="score" id="scorePlayer2">0</span>
            <span id="player2Display">🔴 Joueur 2</span>
        </div>

        <div class="question-panel">
            <div class="consigne-temps" id="consigneTour">À quel temps ?</div>
            <div class="verbe-a-deviner" id="verbeActuel">manger</div>

            <div class="boutons-reponse" id="boutonsReponse">
                <!-- généré dynamiquement -->
            </div>

            <div class="timer-bar">
                <div class="timer-fill" id="timerFill" style="width:100%;"></div>
            </div>
            <div class="feedback-message" id="feedbackMessage">Prêt ? C'est parti !</div>
        </div>

        <div class="footer-stats">
            <span id="compteurVerbes">Défi 1/60</span>
            <span>⏳ <span id="timerDisplay">12</span>s</span>
        </div>
        <button class="restart-btn" id="restartBtn">🔄 Nouveau duel</button>
    </div>
</div>

<script>
    (function() {
        // ---------- LISTE DE VERBES CONJUGUÉS (phrase + temps) ----------
        const verbesListe = [
            { phrase: "Je mange une pomme", temps: "present" },
            { phrase: "Tu as fini ton travail", temps: "passe" },
            { phrase: "Nous allons visiter Paris", temps: "futur" },
            { phrase: "Il chante très bien", temps: "present" },
            { phrase: "Elle est partie en vacances", temps: "passe" },
            { phrase: "Ils vont regarder un film", temps: "futur" },
            { phrase: "Nous dansons chaque soir", temps: "present" },
            { phrase: "J'ai acheté du pain", temps: "passe" },
            { phrase: "Tu vas rencontrer ta sœur", temps: "futur" },
            { phrase: "Vous prenez le café", temps: "present" },
            { phrase: "Elles sont arrivées tôt", temps: "passe" },
            { phrase: "On va préparer le dîner", temps: "futur" },
            { phrase: "Je fais du sport", temps: "present" },
            { phrase: "Nous avons vu un spectacle", temps: "passe" },
            { phrase: "Elle va apprendre l'italien", temps: "futur" },
            { phrase: "Tu écris une lettre", temps: "present" },
            { phrase: "Ils sont descendus par l'escalier", temps: "passe" },
            { phrase: "Vous allez voyager au Japon", temps: "futur" },
            { phrase: "On parle français", temps: "present" },
            { phrase: "J'ai perdu mes clés", temps: "passe" },
            { phrase: "Nous allons déménager", temps: "futur" },
            { phrase: "Elle lit un magazine", temps: "present" },
            { phrase: "Tu as pris le train", temps: "passe" },
            { phrase: "Ils vont acheter une voiture", temps: "futur" },
            { phrase: "Nous réfléchissons ensemble", temps: "present" },
            { phrase: "Je suis tombé dans la rue", temps: "passe" },
            { phrase: "Vous allez adorer ce livre", temps: "futur" },
            { phrase: "Il pleut beaucoup", temps: "present" },
            { phrase: "Elles se sont levées tôt", temps: "passe" },
            { phrase: "Tu vas réussir ton examen", temps: "futur" },
            { phrase: "Nous voulons un gâteau", temps: "present" },
            { phrase: "J'ai écrit un poème", temps: "passe" },
            { phrase: "Il va faire beau demain", temps: "futur" },
            { phrase: "Vous partez en vacances", temps: "present" },
            { phrase: "Elle est venue à pied", temps: "passe" },
            { phrase: "Nous allons fêter ton anniversaire", temps: "futur" },
            { phrase: "Tu dessines un paysage", temps: "present" },
            { phrase: "Ils ont joué au football", temps: "passe" },
            { phrase: "Je vais me promener", temps: "futur" },
            { phrase: "On ouvre la fenêtre", temps: "present" },
            { phrase: "Vous êtes restés longtemps", temps: "passe" },
            { phrase: "Elle va acheter des fleurs", temps: "futur" },
            { phrase: "Je prends le métro", temps: "present" },
            { phrase: "Tu as bien dormi ?", temps: "passe" },
            { phrase: "Nous allons skier en montagne", temps: "futur" },
            { phrase: "Ils écoutent de la musique", temps: "present" },
            { phrase: "Elle a fini son dessert", temps: "passe" },
            { phrase: "Vous allez gagner !", temps: "futur" },
            { phrase: "Je cours tous les jours", temps: "present" },
            { phrase: "Nous sommes restés chez nous", temps: "passe" },
            { phrase: "Tu vas devenir célèbre", temps: "futur" },
            { phrase: "Il neige en montagne", temps: "present" },
            { phrase: "J'ai oublié mon téléphone", temps: "passe" },
            { phrase: "Elles vont chanter à la fête", temps: "futur" },
            { phrase: "Nous dormons profondément", temps: "present" },
            { phrase: "Vous avez réussi !", temps: "passe" },
            { phrase: "Il va pleuvoir ce soir", temps: "futur" },
            { phrase: "Tu viens avec nous ?", temps: "present" },
            { phrase: "Je me suis lavé les mains", temps: "passe" },
            { phrase: "On va manger au restaurant", temps: "futur" }
        ];

        // ---------- ÉTAT DU JEU ----------
        let currentIndex = 0;
        let scorePlayer1 = 0, scorePlayer2 = 0;
        let player1Name = "Joueur 1", player2Name = "Joueur 2";
        let currentPlayer = "player1"; // "player1" ou "player2"
        let gameActive = false;
        let timerInterval = null;
        let timeLeft = 12; // secondes (minimum 12)
        let canAnswer = true;

        // Éléments DOM
        const setupScreen = document.getElementById('setupScreen');
        const gameScreen = document.getElementById('gameScreen');
        const player1Input = document.getElementById('player1Name');
        const player2Input = document.getElementById('player2Name');
        const player1Display = document.getElementById('player1Display');
        const player2Display = document.getElementById('player2Display');
        const scorePlayer1Span = document.getElementById('scorePlayer1');
        const scorePlayer2Span = document.getElementById('scorePlayer2');
        const verbeActuelSpan = document.getElementById('verbeActuel');
        const consigneTour = document.getElementById('consigneTour');
        const boutonsReponseDiv = document.getElementById('boutonsReponse');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const compteurVerbesSpan = document.getElementById('compteurVerbes');
        const timerDisplay = document.getElementById('timerDisplay');
        const timerFill = document.getElementById('timerFill');
        const restartBtn = document.getElementById('restartBtn');
        const joinPlayer1Btn = document.getElementById('joinPlayer1Btn');
        const joinPlayer2Btn = document.getElementById('joinPlayer2Btn');

        // Initialisation
        setupScreen.style.display = 'block';
        gameScreen.classList.remove('visible');

        // Fonction pour démarrer la partie en tant que joueur 1 ou 2
        function startGameAs(role) {
            player1Name = player1Input.value.trim() || "Joueur 1";
            player2Name = player2Input.value.trim() || "Joueur 2";
            player1Display.innerHTML = `🔵 ${player1Name}`;
            player2Display.innerHTML = `🔴 ${player2Name}`;

            // Réinitialiser scores et mélanger
            currentIndex = 0;
            scorePlayer1 = 0;
            scorePlayer2 = 0;
            updateScores();

            // Mélanger les verbes pour plus de variété
            shuffleArray(verbesListe);

            // Définir quel joueur commence (celui qui a cliqué)
            currentPlayer = role; // "player1" ou "player2"

            // Afficher l'écran de jeu
            setupScreen.style.display = 'none';
            gameScreen.classList.add('visible');
            gameActive = true;

            // Lancer le premier défi
            nextVerbe();
        }

        // Mélange aléatoire
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        // Mise à jour des scores
        function updateScores() {
            scorePlayer1Span.textContent = scorePlayer1;
            scorePlayer2Span.textContent = scorePlayer2;
        }

        // Crée les 3 boutons (Présent, Passé composé, Futur proche)
        function renderButtons() {
            boutonsReponseDiv.innerHTML = ''; 
            createButton("Présent", "present", "present");
            createButton("Passé composé", "passe", "passe");
            createButton("Futur proche", "futur", "futur");
        }

        function createButton(text, genderKey, cssClass) {
            const btn = document.createElement('button');
            btn.className = `btn-reponse ${cssClass}`;
            btn.textContent = text;
            btn.setAttribute('data-temps', genderKey);
            btn.addEventListener('click', () => handleAnswer(genderKey));
            boutonsReponseDiv.appendChild(btn);
        }

        // Gestion de la réponse
        function handleAnswer(tempsChoisi) {
            if (!canAnswer || !gameActive) return;

            const verbeCourant = verbesListe[currentIndex];
            if (!verbeCourant) return;

            const tempsCorrect = verbeCourant.temps; // 'present', 'passe', 'futur'
            const correct = (tempsChoisi === tempsCorrect);

            // Désactiver les boutons
            disableButtons(true);

            // Attribution du point
            if (correct) {
                feedbackMessage.textContent = "✅ Bonne réponse ! +1 point";
                if (currentPlayer === 'player1') {
                    scorePlayer1++;
                } else {
                    scorePlayer2++;
                }
            } else {
                feedbackMessage.textContent = `❌ Ce n'est pas le bon temps. (C'était du ${traduireTemps(tempsCorrect)})`;
            }

            updateScores();

            // Passer au verbe suivant ou terminer
            setTimeout(() => {
                if (currentIndex < verbesListe.length - 1) {
                    currentIndex++;
                    nextVerbe();
                } else {
                    // Fin du jeu
                    gameActive = false;
                    feedbackMessage.textContent = "🏆 Duel terminé ! Bravo aux deux joueurs !";
                    disableButtons(true);
                    if (timerInterval) clearInterval(timerInterval);
                }
            }, 1800);
        }

        // Traduire temps pour l'affichage
        function traduireTemps(t) {
            if (t === 'present') return 'présent';
            if (t === 'passe') return 'passé composé';
            return 'futur proche';
        }

        // Activer/désactiver boutons
        function disableButtons(disabled) {
            document.querySelectorAll('.btn-reponse').forEach(btn => btn.disabled = disabled);
        }

        // Timer
        function startTimer(seconds) {
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = seconds;
            timerDisplay.textContent = timeLeft;
            timerFill.style.width = '100%';
            canAnswer = true;

            timerInterval = setInterval(() => {
                if (!gameActive) {
                    clearInterval(timerInterval);
                    return;
                }
                timeLeft--;
                timerDisplay.textContent = timeLeft >= 0 ? timeLeft : 0;
                timerFill.style.width = `${(timeLeft / seconds) * 100}%`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (canAnswer) {
                        canAnswer = false;
                        const verbeCourant = verbesListe[currentIndex];
                        feedbackMessage.textContent = `⏰ Temps écoulé ! (C'était du ${traduireTemps(verbeCourant.temps)})`;
                        disableButtons(true);
                        // Passer au suivant après un délai
                        setTimeout(() => {
                            if (currentIndex < verbesListe.length - 1) {
                                currentIndex++;
                                nextVerbe();
                            } else {
                                gameActive = false;
                                feedbackMessage.textContent = "🏆 Duel terminé !";
                            }
                        }, 1800);
                    }
                }
            }, 1000);
        }

        // Charge le verbe suivant
        function nextVerbe() {
            if (!gameActive) return;

            const verbe = verbesListe[currentIndex];
            verbeActuelSpan.textContent = verbe.phrase;

            // Met à jour le compteur
            compteurVerbesSpan.textContent = `Défi ${currentIndex+1}/${verbesListe.length}`;

            // Change de joueur (alternance)
            currentPlayer = (currentPlayer === 'player1' ? 'player2' : 'player1');
            const joueurActuel = (currentPlayer === 'player1') ? player1Name : player2Name;
            consigneTour.textContent = `🤔 À ${joueurActuel} de jouer !`;
            feedbackMessage.textContent = `Choisis le temps !`;

            // Génère les boutons
            renderButtons();

            // Réactive et lance le timer
            disableButtons(false);
            startTimer(12); // 12 secondes
        }

        // Recommencer
        restartBtn.addEventListener('click', () => {
            if (timerInterval) clearInterval(timerInterval);
            gameActive = false;
            setupScreen.style.display = 'block';
            gameScreen.classList.remove('visible');
            currentIndex = 0;
            scorePlayer1 = 0; scorePlayer2 = 0;
            updateScores();
            player1Input.value = 'Axel';
            player2Input.value = 'Jade';
            feedbackMessage.textContent = 'Prêt ? C\'est parti !';
        });

        // Écouteurs des boutons "Je suis Joueur"
        joinPlayer1Btn.addEventListener('click', () => startGameAs('player1'));
        joinPlayer2Btn.addEventListener('click', () => startGameAs('player2'));

    })();
</script>
</body>
</html>
