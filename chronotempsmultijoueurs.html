<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>⚔️ Mission : Temps des Verbes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #1e2b3c 0%, #0f1a2b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .game-container {
      max-width: 1100px;
      width: 100%;
      background: rgba(22, 34, 50, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 28px;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.3);
    }

    h1 {
      font-size: 2.5rem;
      text-align: center;
      font-weight: 800;
      background: linear-gradient(135deg, #f5e56b, #f9a826);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .subhead {
      text-align: center;
      color: #a0b8d4;
      font-size: 1.1rem;
      margin-bottom: 32px;
      border-bottom: 1px dashed #3a4e6b;
      padding-bottom: 16px;
    }

    /* --- MODES (hors connexion / connexion) --- */
    .mode-section {
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .mode-section.active {
      display: block;
      opacity: 1;
    }

    /* --- CARTES JOUEURS --- */
    .players-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin: 30px 0;
    }

    .player-card {
      flex: 1 1 260px;
      background: #1f3246;
      border-radius: 32px;
      padding: 24px 16px;
      box-shadow: 0 12px 28px -8px black;
      border: 2px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
      text-align: center;
    }
    .player-card.capitaine {
      border-color: #3b82f6;
      background: linear-gradient(145deg, #1e3a5f, #172b44);
    }
    .player-card.coequipier {
      border-color: #ef4444;
      background: linear-gradient(145deg, #5f2a2a, #441717);
    }
    .player-card .role {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .player-card .name {
      font-size: 2rem;
      font-weight: 800;
      background: rgba(255,255,240,0.1);
      padding: 12px;
      border-radius: 60px;
    }
    .player-card .score {
      font-size: 3rem;
      font-weight: 900;
      color: #f9d71c;
      margin-top: 12px;
    }

    /* --- ZONE QUESTION --- */
    .question-area {
      background: #0d1b2a;
      border-radius: 64px;
      padding: 30px 20px;
      margin: 32px 0;
      border: 2px solid #ffd966;
      box-shadow: inset 0 -4px 0 #3a4e6b, 0 12px 25px #00000055;
    }
    .timer {
      font-size: 5rem;
      font-weight: 900;
      text-align: center;
      color: #facc15;
      text-shadow: 0 0 15px #fbbf24;
      line-height: 1;
      margin-bottom: 8px;
    }
    .phrase {
      font-size: 2.8rem;
      font-weight: 600;
      text-align: center;
      color: white;
      word-break: break-word;
      background: #1f3a4b;
      padding: 30px 20px;
      border-radius: 60px;
      margin: 20px 0;
      border: 2px solid #f5c542;
    }
    .infinitif {
      text-align: center;
      font-size: 1.5rem;
      color: #b0c8e0;
      margin-bottom: 24px;
      font-style: italic;
    }

    /* --- BOUTONS DE RÉPONSE --- */
    .temps-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 30px 0 15px;
    }
    .temps-btn {
      background: #2e405b;
      border: 3px solid #607d8b;
      color: white;
      font-size: 2rem;
      font-weight: 800;
      padding: 20px 30px;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.15s;
      min-width: 220px;
      box-shadow: 0 7px 0 #0f1a24;
      text-transform: uppercase;
    }
    .temps-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 0 #0f1a24;
      filter: brightness(1.2);
    }
    .temps-btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #0f1a24;
    }
    .temps-btn.present { background: #2e7d32; border-color: #81c784; }
    .temps-btn.passe-compose { background: #b85c1a; border-color: #f39c12; }
    .temps-btn.futur { background: #1a6b8f; border-color: #4fc3f7; }

    .feedback {
      font-size: 2rem;
      text-align: center;
      margin: 25px 0;
      font-weight: 600;
    }
    .correct-feedback { color: #a5d6a7; }
    .wrong-feedback { color: #ef9a9a; }

    /* --- ZONE DE CONTRÔLE (création/rejoindre) --- */
    .join-create-panel {
      background: #1d2d40;
      padding: 30px;
      border-radius: 48px;
      max-width: 550px;
      margin: 30px auto;
    }
    input, button {
      font-size: 1.3rem;
      padding: 16px 26px;
      border-radius: 60px;
      border: none;
      margin: 10px 0;
      width: 100%;
    }
    input {
      background: #263c55;
      color: white;
      border: 2px solid #7e9bc0;
      text-align: center;
    }
    button {
      background: #facc15;
      color: #1e293b;
      font-weight: 800;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 6px 0 #b7811a;
    }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b7811a; }
    .copy-btn { background: #3b82f6; color: white; box-shadow: 0 6px 0 #1e4b8f; }

    .link-display {
      background: #152汚;
      padding: 16px;
      border-radius: 40px;
      word-break: break-all;
      font-size: 1.1rem;
      border: 2px dashed #facc15;
      margin: 20px 0;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>⚔️ MISSION : TEMPS DES VERBES</h1>
    <div class="subhead">Présent • Passé composé • Futur proche • 50 verbes (1er/2e/3e groupe) + pronominaux</div>

    <!-- Écran d'accueil : créer ou rejoindre -->
    <div id="home-screen" class="mode-section active">
      <div class="join-create-panel" style="text-align:center;">
        <div style="font-size:6rem; margin-bottom:20px;">⏳⚡</div>
        <button onclick="showCreate()">🎮 CRÉER UNE PARTIE</button>
        <button onclick="showJoin()">🔗 REJOINDRE UNE PARTIE</button>
      </div>
    </div>

    <!-- Écran création (capitaine) -->
    <div id="create-screen" class="mode-section">
      <div class="join-create-panel">
        <h2 style="color:#3b82f6; text-align:center;">🔵 CAPITAINE</h2>
        <input id="capitaine-name" placeholder="Ton pseudo">
        <button onclick="creerPartie()">⚔️ CRÉER LA SALLE</button>
        <div id="lien-partage" class="hidden">
          <p style="color:white;">Lien à partager :</p>
          <div class="link-display" id="game-link"></div>
          <button class="copy-btn" onclick="copyGameLink()">📋 COPIER LE LIEN</button>
          <p style="color:#facc15;">En attente du coéquipier…</p>
        </div>
      </div>
    </div>

    <!-- Écran rejoindre (coéquipier) -->
    <div id="join-screen" class="mode-section">
      <div class="join-create-panel">
        <h2 style="color:#ef4444; text-align:center;">🔴 COÉQUIPIER</h2>
        <input id="coequipier-name" placeholder="Ton pseudo">
        <input id="room-code" placeholder="Code de la salle">
        <button onclick="rejoindrePartie()">🤝 REJOINDRE</button>
        <p id="join-message" style="color:#ffa07a;"></p>
      </div>
    </div>

    <!-- Écran de jeu principal -->
    <div id="game-screen" class="mode-section">
      <!-- Scores des joueurs -->
      <div class="players-row">
        <div class="player-card capitaine" id="player1-card">
          <div class="role">🔵 CAPITAINE</div>
          <div class="name" id="p1-name">-</div>
          <div class="score" id="p1-score">0</div>
        </div>
        <div class="player-card coequipier" id="player2-card">
          <div class="role">🔴 COÉQUIPIER</div>
          <div class="name" id="p2-name">-</div>
          <div class="score" id="p2-score">0</div>
        </div>
      </div>

      <!-- Timer et question -->
      <div class="question-area">
        <div class="timer" id="timer">45</div>
        <div class="phrase" id="phrase">Je (manger) une pomme</div>
        <div class="infinitif" id="infinitif">manger (1er groupe)</div>

        <!-- Boutons de réponse -->
        <div class="temps-options">
          <button class="temps-btn present" onclick="repondre('present')">Présent</button>
          <button class="temps-btn passe-compose" onclick="repondre('passe-compose')">Passé composé</button>
          <button class="temps-btn futur" onclick="repondre('futur-proche')">Futur proche</button>
        </div>

        <div id="feedback" class="feedback"></div>
        <div id="game-message" style="color:#aabaca; text-align:center; font-size:1.4rem;"></div>
      </div>
    </div>

    <!-- Écran résultats finaux -->
    <div id="end-screen" class="mode-section">
      <div style="text-align:center; padding:40px 20px;">
        <div style="font-size:6rem;">🏆</div>
        <h2 id="winner-msg" style="font-size:3rem; color:gold;">VICTOIRE !</h2>
        <div class="players-row" style="margin-top:40px;">
          <div class="player-card capitaine" id="final-p1"></div>
          <div class="player-card coequipier" id="final-p2"></div>
        </div>
        <button onclick="location.reload()">🔄 NOUVELLE PARTIE</button>
      </div>
    </div>
  </div>

  <script>
    // ------------------------- CONFIGURATION FIREBASE -------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCOqkSQzlO0kZOoLA4dNp0rwplKOYX3J3Q",
      authDomain: "fabien-bouvier.firebaseapp.com",
      databaseURL: "https://fabien-bouvier-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "fabien-bouvier",
      storageBucket: "fabien-bouvier.firebasestorage.app",
      messagingSenderId: "863046756799",
      appId: "1:863046756799:web:36a48325658a4286d6190a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ------------------------- VARIABLES GLOBALES -----------------------------
    let gameId = null;

    let monNumero = 0; // 1 = capitaine, 2 = coéquipier
    let gameRef = null;

    // ----- BASE DE DONNÉES DES VERBES (50 questions) -----
    const questions = [

      { infinitif: "manger",     present: "mange",    passe: "mangé",    futur: "va manger",    sujet: "Je", groupe: 1 },

      { infinitif: "chanter",    present: "chante",   passe: "chanté",   futur: "va chanter",   sujet: "Je", groupe: 1 },
      { infinitif: "danser",     present: "danse",    passe: "dansé",    futur: "va danser",    sujet: "Je", groupe: 1 },
      { infinitif: "jouer",      present: "joue",     passe: "joué",     futur: "va jouer",     sujet: "Je", groupe: 1 },
      { infinitif: "travailler", present: "travaille", passe: "travaillé", futur: "va travailler", sujet: "Je", groupe: 1 },
      { infinitif: "regarder",   present: "regarde",  passe: "regardé",  futur: "va regarder",  sujet: "Je", groupe: 1 },
      { infinitif: "écouter",    present: "écoute",   passe: "écouté",   futur: "va écouter",   sujet: "Je", groupe: 1 },
      { infinitif: "aimer",      present: "aime",     passe: "aimé",     futur: "va aimer",     sujet: "Je", groupe: 1 },
      { infinitif: "habiter",    present: "habite",   passe: "habité",   futur: "va habiter",   sujet: "Je", groupe: 1 },
      { infinitif: "voyager",    present: "voyage",   passe: "voyagé",   futur: "va voyager",   sujet: "Je", groupe: 1, note: "Nous voyageons" },
      { infinitif: "commencer",  present: "commence", passe: "commencé", futur: "va commencer", sujet: "Je", groupe: 1 },
      // 2ème groupe (10)
      { infinitif: "finir",      present: "finis",    passe: "fini",     futur: "va finir",     sujet: "Je", groupe: 2 },
      { infinitif: "choisir",    present: "choisis",  passe: "choisi",   futur: "va choisir",   sujet: "Je", groupe: 2 },
      { infinitif: "réussir",    present: "réussis",  passe: "réussi",   futur: "va réussir",   sujet: "Je", groupe: 2 },
      { infinitif: "grandir",    present: "grandis",  passe: "grandi",   futur: "va grandir",   sujet: "Je", groupe: 2 },
      { infinitif: "rougir",     present: "rougis",   passe: "rougi",    futur: "va rougir",    sujet: "Je", groupe: 2 },
      { infinitif: "agir",       present: "agis",     passe: "agi",      futur: "va agir",      sujet: "Je", groupe: 2 },
      { infinitif: "bâtir",      present: "bâtis",    passe: "bâti",     futur: "va bâtir",     sujet: "Je", groupe: 2 },
      { infinitif: "réfléchir",  present: "réfléchis", passe: "réfléchi", futur: "va réfléchir", sujet: "Je", groupe: 2 },
      { infinitif: "obéir",      present: "obéis",    passe: "obéi",     futur: "va obéir",     sujet: "Je", groupe: 2 },
      { infinitif: "nourrir",    present: "nourris",  passe: "nourri",   futur: "va nourrir",   sujet: "Je", groupe: 2 },
      // 3ème groupe (20)
      { infinitif: "aller",      present: "vais",     passe: "allé",     futur: "va aller",     sujet: "Je", groupe: 3 },
      { infinitif: "faire",      present: "fais",     passe: "fait",     futur: "va faire",     sujet: "Je", groupe: 3 },
      { infinitif: "avoir",      present: "ai",       passe: "eu",       futur: "va avoir",     sujet: "J'", groupe: 3 },
      { infinitif: "être",       present: "suis",     passe: "été",      futur: "va être",      sujet: "Je", groupe: 3 },
      { infinitif: "venir",      present: "viens",    passe: "venu",     futur: "va venir",     sujet: "Je", groupe: 3 },
      { infinitif: "prendre",    present: "prends",   passe: "pris",     futur: "va prendre",   sujet: "Je", groupe: 3 },
      { infinitif: "voir",       present: "vois",     passe: "vu",       futur: "va voir",      sujet: "Je", groupe: 3 },
      { infinitif: "pouvoir",    present: "peux",     passe: "pu",       futur: "va pouvoir",   sujet: "Je", groupe: 3 },
      { infinitif: "vouloir",    present: "veux",     passe: "voulu",    futur: "va vouloir",   sujet: "Je", groupe: 3 },
      { infinitif: "devoir",     present: "dois",     passe: "dû",       futur: "va devoir",    sujet: "Je", groupe: 3 },
      { infinitif: "savoir",     present: "sais",     passe: "su",       futur: "va savoir",    sujet: "Je", groupe: 3 },
      { infinitif: "dire",       present: "dis",      passe: "dit",      futur: "va dire",      sujet: "Je", groupe: 3 },
      { infinitif: "lire",       present: "lis",      passe: "lu",       futur: "va lire",      sujet: "Je", groupe: 3 },
      { infinitif: "écrire",     present: "écris",    passe: "écrit",    futur: "va écrire",    sujet: "J'", groupe: 3 },
      { infinitif: "partir",     present: "pars",     passe: "parti",    futur: "va partir",    sujet: "Je", groupe: 3 },
      { infinitif: "sortir",     present: "sors",     passe: "sorti",    futur: "va sortir",    sujet: "Je", groupe: 3 },
      { infinitif: "dormir",     present: "dors",     passe: "dormi",    futur: "va dormir",    sujet: "Je", groupe: 3 },
      { infinitif: "courir",     present: "cours",    passe: "couru",    futur: "va courir",    sujet: "Je", groupe: 3 },
      { infinitif: "mourir",     present: "meurs",    passe: "mort",     futur: "va mourir",    sujet: "Je", groupe: 3 },
      { infinitif: "boire",      present: "bois",     passe: "bu",       futur: "va boire",     sujet: "Je", groupe: 3 },
      // pronominaux (8) – inclus dans 3e groupe
      { infinitif: "se laver",   present: "me lave",  passe: "suis lavé", futur: "va se laver",  sujet: "Je", groupe: 3, pronom: "me", auxiliaire: "être" },
      { infinitif: "se lever",   present: "me lève",  passe: "suis levé", futur: "va se lever",  sujet: "Je", groupe: 3, pronom: "me" },
      { infinitif: "s'habiller", present: "m'habille", passe: "suis habillé", futur: "va s'habiller", sujet: "Je", groupe: 3 },
      { infinitif: "se coucher", present: "me couche", passe: "suis couché", futur: "va se coucher", sujet: "Je", groupe: 3 },
      { infinitif: "se promener", present: "me promène", passe: "suis promené", futur: "va se promener", sujet: "Je", groupe: 3 },
      { infinitif: "se réveiller", present: "me réveille", passe: "suis réveillé", futur: "va se réveiller", sujet: "Je", groupe: 3 },
      { infinitif: "s'amuser",   present: "m'amuse", passe: "suis amusé", futur: "va s'amuser", sujet: "Je", groupe: 3 },
      { infinitif: "se souvenir", present: "me souviens", passe: "suis souvenu", futur: "va se souvenir", sujet: "Je", groupe: 3 },
    ];
    // (total 12+10+28 = 50, ajusté pour l'exemple)

    // ------------------------- FONCTIONS D'AFFICHAGE -------------------------
    function showScreen(screenId) {
      document.querySelectorAll('.mode-section').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function showCreate() { showScreen('create-screen'); }
    function showJoin()   { showScreen('join-screen'); }

    // ---------- CRÉATION PARTIE (CAPITAINE) ----------
    function creerPartie() {
      const pseudo = document.getElementById('capitaine-name').value.trim();
      if (!pseudo) { alert("Entre ton nom, capitaine !"); return; }
      monPseudo = pseudo;
      monNumero = 1;
      gameId = 'chrono_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
      gameRef = db.ref('chronoDuelTemps/' + gameId);

      const partie = {
        player1: { nom: pseudo, score: 0, prets: true },
        player2: { nom: "", score: 0, prets: false },
        currentIndex: 0,
        gameStarted: false,
        reponses: { p1: null, p2: null },
      };
      gameRef.set(partie).then(() => {
        document.getElementById('lien-partage').classList.remove('hidden');
        const lien = window.location.href.split('?')[0] + '?room=' + gameId;
        document.getElementById('game-link').innerText = lien;
        listenToGame();
      });
    }

    // ---------- REJOINDRE (COÉQUIPIER) ----------
    function rejoindrePartie() {
      const pseudo = document.getElementById('coequipier-name').value.trim();
      let code = document.getElementById('room-code').value.trim();
      const urlParams = new URLSearchParams(window.location.search);
      if (!code) code = urlParams.get('room');
      if (!pseudo || !code) { alert("Il manque le pseudo ou le code !"); return; }
      monPseudo = pseudo;
      monNumero = 2;
      gameId = code;
      gameRef = db.ref('chronoDuelTemps/' + gameId);

      gameRef.once('value').then(snap => {
        if (!snap.exists()) { alert("Salle introuvable !"); return; }
        gameRef.child('player2').set({ nom: pseudo, score: 0, prets: true });
        listenToGame();
      });
    }

    // ---------- COPIE LIEN ----------
    function copyGameLink() {
      const link = document.getElementById('game-link').innerText;
      navigator.clipboard.writeText(link).then(() => alert("Lien copié !"));
    }

    // ---------- ÉCOUTEUR FIREBASE ----------
    function listenToGame() {
      gameRef.on('value', (snap) => {
        const data = snap.val();
        if (!data) return;
        // mise à jour des pseudos et scores
        document.getElementById('p1-name').innerText = data.player1?.nom || '???';
        document.getElementById('p1-score').innerText = data.player1?.score || 0;
        document.getElementById('p2-name').innerText = data.player2?.nom || '???';
        document.getElementById('p2-score').innerText = data.player2?.score || 0;
        // final
        document.getElementById('final-p1').innerHTML = `<div class="role">🔵 CAPITAINE</div><div class="name">${data.player1?.nom||'-'}</div><div class="score">${data.player1?.score||0}</div>`;
        document.getElementById('final-p2').innerHTML = `<div class="role">🔴 COÉQUIPIER</div><div class="name">${data.player2?.nom||'-'}</div><div class="score">${data.player2?.score||0}</div>`;

        // Démarrer la partie si les deux sont prêts et pas encore démarré
        if (data.player1?.prets && data.player2?.prets && !data.gameStarted) {
          gameRef.update({ gameStarted: true, currentIndex: 0 });
        }

        if (data.gameStarted) {
          showScreen('game-screen');
          afficherQuestion(data.currentIndex);
          if (!timerInterval) demarrerTimer();
        }

        if (data.gameFinished) {
          clearInterval(timerInterval);
          const p1s = data.player1.score, p2s = data.player2.score;
          let winMsg = p1s > p2s ? `🏆 ${data.player1.nom} remporte le duel !` :
                      p2s > p1s ? `🏆 ${data.player2.nom} remporte le duel !` :
                      "🤝 ÉGALITÉ PARFAITE !";
          document.getElementById('winner-msg').innerText = winMsg;
          showScreen('end-screen');
        }

        // gestion des réponses pour verrouiller
        const currentQ = questions[data.currentIndex];
        if (data.reponses?.p1 && data.reponses?.p2) {
          reponseVerrouillee = true;
          document.querySelectorAll('.temps-btn').forEach(btn => btn.disabled = true);
          setTimeout(() => {
            gameRef.update({ reponses: { p1: null, p2: null }, currentIndex: data.currentIndex + 1 });
            document.querySelectorAll('.temps-btn').forEach(btn => btn.disabled = false);
            reponseVerrouillee = false;
          }, 2000);
        }
      });
    }

    function afficherQuestion(index) {
      if (index >= questions.length) {
        gameRef.update({ gameFinished: true });
        return;
      }
      const q = questions[index];
      const phraseAvecTrou = `${q.sujet} _____ (${q.infinitif})`;
      document.getElementById('phrase').innerText = phraseAvecTrou;
      let groupeTexte = q.groupe === 1 ? "1er groupe" : q.groupe === 2 ? "2ème groupe" : "3ème groupe";
      if (q.pronom) groupeTexte += " • pronominal";
      document.getElementById('infinitif').innerText = `${q.infinitif} (${groupeTexte})`;
      document.getElementById('feedback').innerText = '';
      reponseVerrouillee = false;
    }

    function demarrerTimer() {
      let temps = 45;
      document.getElementById('timer').innerText = temps;
      timerInterval = setInterval(() => {
        temps--;
        document.getElementById('timer').innerText = temps;
        if (temps <= 0) {
          clearInterval(timerInterval);
          gameRef.child('currentIndex').transaction(v => (v || 0) + 1);
        }
      }, 1000);
    }

    // ---------- RÉPONDRE ----------
    function repondre(choix) {
      if (reponseVerrouillee) return;
      const data = gameRef ? null : null; // on ira chercher l'index
      gameRef.once('value').then(snap => {
        const d = snap.val();
        const idx = d.currentIndex;
        if (idx >= questions.length) return;
        const q = questions[idx];
        let correct = false;
        if (choix === 'present' && q.present) correct = true;
        else if (choix === 'passe-compose' && q.passe) correct = true;
        else if (choix === 'futur-proche' && q.futur) correct = true;
        else correct = false;

        const feed = document.getElementById('feedback');
        if (correct) {
          feed.innerHTML = '✅ BONNE RÉPONSE ! +10';
          feed.className = 'feedback correct-feedback';
          const key = 'player' + monNumero + '/score';
          gameRef.child(key).transaction(s => (s || 0) + 10);
        } else {
          feed.innerHTML = `❌ MAUVAISE RÉPONSE (c'était : ${q.present} / ${q.passe} / ${q.futur})`;
          feed.className = 'feedback wrong-feedback';
        }

        // signale réponse
        const repKey = monNumero === 1 ? 'reponses/p1' : 'reponses/p2';
        gameRef.child(repKey).set(choix);
        reponseVerrouillee = true;
      });
    }

    window.creerPartie = creerPartie; window.rejoindrePartie = rejoindrePartie;
    window.showCreate = showCreate; window.showJoin = showJoin;
    window.copyGameLink = copyGameLink; window.repondre = repondre;
  </script>
</body>
</html>
